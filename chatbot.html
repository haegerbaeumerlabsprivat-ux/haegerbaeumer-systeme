<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micbot – KI-Assistent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 720px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .header-info h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .header-info span {
      font-size: 12px;
      color: #a0aec0;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #48bb78;
      border-radius: 50%;
      display: inline-block;
    }

    /* Messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 2px; }

    .message {
      display: flex;
      gap: 8px;
      max-width: 85%;
    }

    .message.bot { align-self: flex-start; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .message-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .message.bot .message-avatar {
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .message.user .message-avatar {
      background: #e2e8f0;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.bot .message-bubble {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      color: #2d3748;
      border-bottom-left-radius: 4px;
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
    }

    .typing-indicator.visible { display: flex; align-items: center; gap: 4px; }

    .typing-dot {
      width: 7px;
      height: 7px;
      background: #a0aec0;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input area */
    .chat-input-area {
      padding: 16px;
      border-top: 1px solid #e2e8f0;
      background: #fff;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      border: 1.5px solid #e2e8f0;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      resize: none;
      max-height: 100px;
      font-family: inherit;
      transition: border-color 0.2s;
      line-height: 1.4;
    }

    .chat-input:focus { border-color: #667eea; }

    .send-btn {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s;
    }

    .send-btn:hover { transform: scale(1.05); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .send-btn svg { width: 18px; height: 18px; fill: #fff; }

    .chat-footer {
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: #a0aec0;
    }

    @media (max-width: 520px) {
      body { background: #fff; }
      .chat-wrapper {
        border-radius: 0;
        max-height: 100vh;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

<div class="chat-wrapper">
  <div class="chat-header">
    <div class="avatar">🤖</div>
    <div class="header-info">
      <h2>Micbot</h2>
      <span><span class="status-dot"></span> Online – Bereit zu helfen</span>
    </div>
  </div>

  <div class="chat-messages" id="messages">
    <div class="message bot">
      <div class="message-avatar">🤖</div>
      <div class="message-bubble">
        Hallo und herzlich willkommen! Mein Name ist Micbot. Wie kann ich Ihnen behilflich sein?
      </div>
    </div>
  </div>

  <div class="typing-indicator" id="typing">
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
  </div>

  <div class="chat-input-area">
    <textarea
      class="chat-input"
      id="userInput"
      placeholder="Nachricht eingeben..."
      rows="1"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="chat-footer">Powered by Hägerbäumer Systeme · KI-Assistent</div>
</div>

<script>
  const WEBHOOK_URL = "https://nicklaurin.app.n8n.cloud/webhook/66a3734f-4d77-41a5-9770-6268a1310e16/chat";
  const sessionId = "session_" + Math.random().toString(36).substr(2, 9);

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const typingEl = document.getElementById("typing");

  // Auto-resize textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + "px";
  });

  // Enter = senden, Shift+Enter = neue Zeile
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "message-avatar";
    avatar.textContent = role === "bot" ? "🤖" : "👤";

    const bubble = document.createElement("div");
    bubble.className = "message-bubble";
    bubble.textContent = text;

    div.appendChild(avatar);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setLoading(loading) {
    sendBtn.disabled = loading;
    inputEl.disabled = loading;
    typingEl.classList.toggle("visible", loading);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    inputEl.value = "";
    inputEl.style.height = "auto";
    setLoading(true);

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chatInput: text,
          sessionId: sessionId
        })
      });

      if (!response.ok) throw new Error("HTTP " + response.status);

      const data = await response.json();
      const reply = data.output || data.text || data.message || data.response || JSON.stringify(data);
      addMessage(reply, "bot");

    } catch (err) {
      addMessage("Es tut mir leid, es ist ein Fehler aufgetreten. Bitte versuchen Sie es erneut.", "bot");
      console.error(err);
    } finally {
      setLoading(false);
      inputEl.focus();
    }
  }
</script>

</body>
</html>
